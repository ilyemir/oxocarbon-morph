# ============================================================================
# oxocarbon-morph :: kitty
# Colors are injected into current-theme.conf by the `theme` engine.
# listen_on enables `kitty @ --to unix:@oxocarbon-kitty` live recolor.
# ============================================================================

font_family      BlexMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 8
background_opacity   1.0

allow_remote_control yes
listen_on unix:@oxocarbon-kitty

scrollback_lines 10000
enable_audio_bell no
update_check_interval 0
cursor_shape beam

include current-theme.conf
