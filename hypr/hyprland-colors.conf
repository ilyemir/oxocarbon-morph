# oxocarbon-morph :: hyprland border palette
# Repo default; the live copy at ~/.config/hypr/hyprland-colors.conf is
# rewritten atomically by `theme set` on every switch (same values it pushes
# via `hyprctl keyword`, so a reload never changes colors).
general {
    col.active_border = rgba(3ddbd9ff)
    col.inactive_border = rgba(393939ff)
}
