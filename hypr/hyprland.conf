# ============================================================================
# oxocarbon-morph :: Hyprland (v1.0)
# Sharp, minimal, Oxocarbon engineering look. 1920x1200 (16:10).
# Border colors live in ~/.config/hypr/hyprland-colors.conf (engine-written)
# and are additionally pushed live via `hyprctl keyword` on every theme set.
# ============================================================================

monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,oxocarbon-cursor
env = HYPRCURSOR_THEME,oxocarbon-cursor
env = PATH,$HOME/.local/bin:$PATH

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        tap-to-click = true
    }
}

# ---------------------------------------------------------------------------
# General (colors come from the sourced palette file below)
# ---------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 15
}

# Palette-driven border colors; written atomically by the `theme` engine.
source = /home/emir-alkan/.config/hypr/hyprland-colors.conf

# ---------------------------------------------------------------------------
# Decoration: zero rounding, zero blur, zero shadow
# ---------------------------------------------------------------------------
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# ---------------------------------------------------------------------------
# Animations: fast, decisive, zero bounce.
# Hyprland speed unit is deciseconds: speed 1.8 = 180ms.
#   oxoEase  -> smooth deceleration (openings, fades)
#   oxoFast  -> near-instant attack (closings, slides)
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = oxoEase, 0.16, 1, 0.3, 1
    bezier = oxoFast, 0.2, 0, 0, 1

    animation = windows, 1, 2.2, oxoEase, popin 92%
    animation = windowsOut, 1, 1.6, oxoFast
    animation = border, 1, 1.2, oxoFast
    animation = fade, 1, 2, oxoEase
    animation = workspaces, 1, 1.8, oxoFast, slide
    animation = specialWorkspace, 1, 2.2, oxoEase, slide
    animation = layers, 1, 2, oxoEase, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # silence the yellow "hyprland-qtutils missing" warning banner
    disable_hyprland_guiutils_check = true
}

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
# Launchers / pickers: centered floating
windowrule = float on, match:class ^(wofi)$
windowrule = size 640 420, match:class ^(wofi)$

# Audio mixer, calculator: centered floating utilities
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 900 620, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$

windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = size 340 460, match:class ^(org.gnome.Calculator)$
windowrule = center on, match:class ^(org.gnome.Calculator)$

windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$

# (Transient dialogs and file pickers set a parent window and are floated
#  by Hyprland automatically.)

# ---------------------------------------------------------------------------
# Binds
# ---------------------------------------------------------------------------
$main = SUPER

# --- apps -------------------------------------------------------------------
bind = $main, RETURN, exec, kitty
bind = $main, D, exec, wofi --show drun
bind = $main, W, exec, /home/emir-alkan/.local/bin/theme-hud
bind = $main, X, exec, /home/emir-alkan/.local/bin/power-menu
bind = $main, L, exec, /home/emir-alkan/.local/bin/hyprlock
bind = $main, B, exec, firefox
bind = $main, E, exec, nautilus
bind = $main, Q, killactive
bind = $main SHIFT, M, exit

# --- Windows-style window management -----------------------------------------
# Super+V       : floating <-> tiled (floating opens 80% x 80%, centered)
# Super+F       : maximize (fills the screen, bars stay visible)
# Super+Shift+F : true fullscreen (covers the bars)
# Super+Arrows  : snap window to the left / right screen half
# Alt+Arrows    : move focus between windows
bind = $main, V, exec, /home/emir-alkan/.local/bin/float-toggle
bind = $main, SPACE, togglefloating
bind = $main, F, fullscreen, 1
bind = $main SHIFT, F, fullscreen, 0

bind = $main, left, exec, /home/emir-alkan/.local/bin/snap left
bind = $main, right, exec, /home/emir-alkan/.local/bin/snap right
bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

# Move windows through the tiling tree
bind = $main SHIFT, left, movewindow, l
bind = $main SHIFT, right, movewindow, r
bind = $main SHIFT, up, movewindow, u
bind = $main SHIFT, down, movewindow, d

# Mouse: Super+drag moves, Super+right-drag resizes
bindm = $main, mouse:272, movewindow
bindm = $main, mouse:273, resizewindow

# --- tiling helpers -----------------------------------------------------------
bind = $main, P, pseudo
bind = $main, J, togglesplit
binde = $main CTRL, right, resizeactive, 40 0
binde = $main CTRL, left, resizeactive, -40 0
binde = $main CTRL, up, resizeactive, 0 -40
binde = $main CTRL, down, resizeactive, 0 40

# --- special:magic pocket (minimize) ------------------------------------------
bind = $main, S, exec, /home/emir-alkan/.local/bin/theme magic toggle
bind = $main SHIFT, S, movetoworkspace, special:magic
bind = SUPER, TAB, workspace, previous

# --- workspaces ----------------------------------------------------------------
bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9
bind = $main SHIFT, 1, movetoworkspace, 1
bind = $main SHIFT, 2, movetoworkspace, 2
bind = $main SHIFT, 3, movetoworkspace, 3
bind = $main SHIFT, 4, movetoworkspace, 4
bind = $main SHIFT, 5, movetoworkspace, 5
bind = $main SHIFT, 6, movetoworkspace, 6
bind = $main SHIFT, 7, movetoworkspace, 7
bind = $main SHIFT, 8, movetoworkspace, 8
bind = $main SHIFT, 9, movetoworkspace, 9

# --- volume / brightness (OSD via hyprctl notify, palette accent) ---------------
bindel = , XF86AudioRaiseVolume, exec, /home/emir-alkan/.local/bin/oxo-osd vol up
bindel = , XF86AudioLowerVolume, exec, /home/emir-alkan/.local/bin/oxo-osd vol down
bindl  = , XF86AudioMute, exec, /home/emir-alkan/.local/bin/oxo-osd vol mute
bindel = , XF86MonBrightnessUp, exec, /home/emir-alkan/.local/bin/oxo-osd bri up
bindel = , XF86MonBrightnessDown, exec, /home/emir-alkan/.local/bin/oxo-osd bri down

# --- clipboard history (Windows Win+V muscle memory, on Super+C) ----------------
bind = $main, C, exec, /home/emir-alkan/.local/bin/clip-menu

# --- screenshots ------------------------------------------------------------------
bind = , PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Pictures/Screenshots/$(ls -t ~/Pictures/Screenshots | head -1)
bind = $main, PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = $main ALT, S, exec, grim -g "$(slurp)" - | wl-copy

# ---------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------
# theme start: swaybg instant frame -> mpvpaper (new IPC socket) -> full sync
exec-once = /home/emir-alkan/.local/bin/theme start
exec-once = /home/emir-alkan/.local/bin/theme-daemon
exec-once = dbus-run-session -- waybar
# dock: waits for the engine to generate dock.jsonc (first theme set)
exec-once = bash -c 'for i in $(seq 1 40); do [ -f $HOME/.config/waybar/dock.jsonc ] && break; sleep 0.25; done; exec dbus-run-session -- waybar -c $HOME/.config/waybar/dock.jsonc -s $HOME/.config/waybar/dock.css'
# clipboard history: every text copy lands in the Super+C picker
exec-once = wl-paste --watch /home/emir-alkan/.local/bin/clip-store
windowrule = float on, match:class .*
