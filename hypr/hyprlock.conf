# ============================================================================
# oxocarbon-morph :: hyprlock
# Colors come from ~/.config/hypr/hyprlock-colors.conf (written atomically
# by the `theme` engine on every theme switch).
# Background frame is extracted from the active wallpaper to
# ~/.cache/oxocarbon-morph/lock.png by the engine.
# ============================================================================

source = /home/emir-alkan/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = /home/emir-alkan/.cache/oxocarbon-morph/lock.png
    color = $bg
    blur_passes = 0
    zindex = -1
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.20
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 0, -220
    halign = center
    valign = center

    outer_color = $border
    inner_color = $surface
    font_color = $ink
    check_color = $accent
    fail_color = $accent_alt
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date '+%Y-%m-%d %H:%M')"
    color = $muted
    font_size = 14
    font_family = BlexMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}
